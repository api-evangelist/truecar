aid: truecar
name: TrueCar
description: >-
  TrueCar is a Santa Monica, California based online automotive marketplace that connects car buyers
  with a nationwide network of certified dealers, publishing upfront, transparent pricing on new and
  used vehicles alongside what other buyers in the same area actually paid. The company operates
  truecar.com, the TrueCar+ end-to-end digital retail experience, a sell-your-car / instant cash offer
  service, and white-label car-buying programs for affinity partners such as credit unions, insurers
  and large employers. Founded in 2005 by Scott Painter, TrueCar traded on NASDAQ as TRUE until
  January 2026, when Fair Holdings, Inc. - led by Painter, with PenFed Credit Union, Zurich North
  America, AutoNation and Atlantic Coast Automotive - completed a $227 million take-private
  acquisition. TrueCar publishes no public developer program, API reference, or machine-readable
  contract; its dealer, DMS and OEM integrations are arranged privately through the dealer portal
  under commercial agreement.
