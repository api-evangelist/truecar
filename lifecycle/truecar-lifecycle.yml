method: probed
source: >-
  Live DNS/TLS/HTTP probes of status.truecar.com, developer.truecar.com, docs.truecar.com and
  api.truecar.com; api.github.com/orgs/TrueCar/repos; TrueCar press releases at
  https://www.truecar.com/public-relations/press-releases/.
note: >-
  TrueCar publishes no API, and therefore no API versioning policy, deprecation policy,
  Sunset/Deprecation header practice (RFC 8594), or SLA. What this file records instead is the
  lifecycle evidence that IS observable - a dangling status-page DNS record, an archived
  open-source organization, and a change of ownership - because each of them is a real signal
  about the durability of anything an integrator might build against.
