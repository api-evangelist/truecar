status_page:
  published: false
  host: status.truecar.com
  dns: CNAME 8v75qyllyhml.stspg-customer.com (Atlassian Statuspage)
  https_status: null
  http_status: 302
  redirect_target: https://www.statuspage.io
  tls: >-
    Handshake fails - the origin presents a certificate for CN=*.statuspage.io, which does not
    match status.truecar.com.
  finding: >-
    DANGLING STATUSPAGE CNAME. TrueCar still points status.truecar.com at Atlassian Statuspage,
    but the underlying status page no longer exists: HTTPS cannot complete a handshake, and plain
    HTTP 302s to Statuspage's own marketing site rather than to a TrueCar status page. No
    `StatusPage` pointer is wired into apis.yml - the surface is configured but not served, and a
    pointer would assert a page TrueCar does not publish.
  evidence:
  - url: https://status.truecar.com/
    status: 000
    note: TLS certificate name mismatch (*.statuspage.io)
  - url: http://status.truecar.com/
    status: 302
    note: 'Location: https://www.statuspage.io; response carries X-Statuspage-Version'
  - url: https://status.truecar.com/api/v2/summary.json
    status: 000
    note: same TLS failure - the Statuspage JSON API is unreachable
